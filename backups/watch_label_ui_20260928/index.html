<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>心拍数モニター</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="dashboard">
    <h1>心拍数モニター</h1>

    <div class="status-card">
      <div id="turn-display-large">全員受付中</div>
      <div id="turn-countdown-banner" class="turn-countdown-banner" aria-live="polite"></div>
      <div id="attack-banner" class="attack-banner" aria-live="polite"></div>
      <div id="current-turn"></div>
      <div id="score-board" class="score-board"></div>
      <div id="game-score-history" class="game-score-history"></div>
      <div id="coop-team-display" class="coop-team-display" style="display:none;"></div>

      <div class="status-row">
        <div id="status" class="status-badge">状態: 未設定</div>
        <div id="game-status" class="status-badge">ゲーム状態: 未設定</div>
        <div id="game-number" class="status-badge">第1ゲーム</div>
        <div id="watch-count" class="status-badge">接続中のデバイス数: 未取得</div>
        <div id="current-target" class="status-badge">利用対象: 未設定</div>
      </div>
    </div>

    <div class="compact-grid">
      <div class="card heart-display-card heart-display-expanded">
        <h3>現在の心拍数</h3>
        <div class="heart-rate-panel">
          <div class="heart-rate-box">
            <div id="rate"><p>読み込み中...</p></div>
            <div class="heart-info-layout">
              <div class="heart-info-status">
                <div id="current-used" class="current-used">利用中の心拍: 未設定</div>
                <div id="attack-status" class="current-used">妨害情報: 取得中...</div>
              </div>
              <section class="card status-summary-card heart-info-average" aria-labelledby="average-heading">
                <h3 id="average-heading">平均心拍数</h3>
                <div id="baseline-area" class="baseline-list"></div>
                <div id="mode-current" class="mode-current">現在の設定：未設定</div>
              </section>
            </div>
            <div id="attack-details" class="attack-card" aria-live="polite"></div>
          </div>
        </div>
        <div class="graph-links" style="margin-top:12px; text-align:center;">
          <a href="/static/settings.html" class="mini-link-btn" style="padding:12px 18px; font-weight:700;">設定画面を開く</a>
        </div>
        <!-- Hidden placeholders so app.js can safely query moved controls -->
        <div id="hidden-placeholders" style="display:none;">
          <select id="jengaSetCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5">5</option>
          </select>
          <button id="nextGameBtn" type="button"></button>
          <button id="csvBtn" type="button" style="display:none;"></button>
          <input id="collapseNotes" type="text" />
          <div id="collapse-status"></div>
          <select id="turnSelector"></select>
          <select id="baselineSelector"></select>
          <div id="baseline-result"></div>
          <button id="resetServer" style="display:none;"></button>
          <button id="resetGameOnly" style="display:none;"></button>
        </div>
      </div>

    </div>
  </div>

  <a href="/babanuki.html" class="mini-link-btn">ババ抜き画面へ</a>
  <div id="mode-banner" class="mode-banner"></div>

  <script src="/static/app.js?v=coop-player-1"></script>
</body>
</html>
